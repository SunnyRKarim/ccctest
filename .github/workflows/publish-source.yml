name: Publish extracted ccctest files
on:
  push:
    paths:
      - '.github/workflows/publish-source.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  unpack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extract archive and stage package files
        shell: bash
        run: |
          python3 - <<'PY'
          from zipfile import ZipFile
          from pathlib import PurePosixPath, Path
          import stat
          archive = Path("ccctest-SunnyRKarim-upload-verified.zip")
          with ZipFile(archive) as zf:
              entries = [entry for entry in zf.infolist() if not entry.is_dir()]
              if len(entries) < 90:
                  raise ValueError("Archive unexpectedly small")
              for entry in entries:
                  p = PurePosixPath(entry.filename)
                  if p.is_absolute() or ".." in p.parts:
                      raise ValueError("Unsafe archive filename")
                  if stat.S_ISLNK((entry.external_attr >> 16) & 0xffff):
                      raise ValueError("Symlink not permitted")
              zf.extractall(".")
          archive.unlink()
          PY
      - name: Commit source files and remove ZIP
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A -- . ':(exclude).github/workflows/check.yml'
          git status --short
          git commit -m "Publish ccctest source package" 
          git push origin HEAD:main
